name: Generate MAVLink C headers

on:
  push:
    branches: [refactored-xml]
    paths:
      - 'message_definitions/**'
      - 'pymavlink'
      - '.github/workflows/generate-headers.yml'
  workflow_dispatch:

# Prevent two runs from racing each other into the output repo
concurrency:
  group: generate-headers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout message definitions
        uses: actions/checkout@v4
        with:
          submodules: recursive   # required: pymavlink is a submodule

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pymavlink dependencies
        run: pip install future lxml

      - name: Generate headers
        run: |
          rm -rf output_dir
          python3 -m pymavlink.tools.mavgen \
            --lang=C \
            --wire-protocol=2.0 \
            -o ./output_dir \
            message_definitions/v1.0/SKYRON.xml

      - name: Show what was generated
        run: find output_dir -type f | sort

      - name: Checkout output repo
        uses: actions/checkout@v4
        with:
          repository: Avestec/mavlink_submodule
          ssh-key: ${{ secrets.HEADERS_DEPLOY_KEY }}
          path: out

      - name: Sync generated headers into output repo
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            output_dir/ out/

      - name: Commit and push
        working-directory: out
        run: |
          git config user.name  "mavlink-generator"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No header changes — nothing to push."
            exit 0
          fi
          git commit \
            -m "Autogenerated from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:8}" \
            -m "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push